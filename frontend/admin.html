<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>华博士聊天记录后台</title>
  <style>
    :root { --ink:#18242e; --muted:#63707a; --line:#dce4e8; --bg:#f4f7f8; --surface:#fff; --brand:#087b72; --brand-dark:#056259; --visitor:#edf3f5; --assistant:#e9f7f2; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); background:var(--bg); font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-panel { width:min(400px, 100%); padding:32px; border:1px solid var(--line); border-radius:8px; background:var(--surface); box-shadow:0 16px 40px rgba(30, 51, 61, .12); }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:8px; color:#fff; background:var(--brand); font-size:20px; font-weight:700; }
    h1, h2, p { margin:0; }
    h1 { font-size:20px; }
    .brand p { margin-top:4px; color:var(--muted); font-size:13px; }
    label { display:block; margin-bottom:8px; color:#43515b; font-size:14px; font-weight:600; }
    input { width:100%; height:44px; padding:0 12px; border:1px solid #cbd7dc; border-radius:5px; outline:none; background:#fff; }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(8,123,114,.12); }
    .primary { width:100%; min-height:44px; border:0; border-radius:5px; color:#fff; background:var(--brand); font-weight:700; }
    .primary:hover { background:var(--brand-dark); }
    .login .primary { margin-top:16px; }
    .error { min-height:20px; margin-top:12px; color:#bc2d35; font-size:13px; }
    .app { display:none; min-height:100vh; }
    body.ready .login { display:none; }
    body.ready .app { display:block; }
    .topbar { height:68px; display:flex; align-items:center; gap:16px; padding:0 max(20px, calc((100vw - 1500px) / 2)); border-bottom:1px solid var(--line); background:var(--surface); }
    .topbar .brand { margin:0; }
    .topbar h1 { font-size:18px; }
    .topbar .brand p { font-size:12px; }
    .stats { display:flex; gap:20px; margin-left:auto; color:var(--muted); font-size:13px; }
    .stats strong { color:var(--ink); font-size:16px; }
    .logout { min-height:34px; padding:0 12px; border:1px solid #bfccd1; border-radius:5px; color:#40505a; background:#fff; font-size:13px; }
    .layout { display:grid; grid-template-columns:330px minmax(0, 1fr); min-height:calc(100vh - 68px); max-width:1500px; margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line); background:var(--surface); }
    .sidebar { min-width:0; border-right:1px solid var(--line); background:#fbfcfc; }
    .search { padding:16px; border-bottom:1px solid var(--line); }
    .search input { height:40px; font-size:14px; }
    .session-list { overflow:auto; max-height:calc(100vh - 141px); }
    .session { width:100%; display:block; padding:14px 16px; border:0; border-bottom:1px solid #e8edef; text-align:left; color:inherit; background:transparent; }
    .session:hover, .session.active { background:#eaf6f3; }
    .session-head, .session-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .session-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:700; }
    .session-time, .session-meta { color:var(--muted); font-size:12px; }
    .session-preview { margin:7px 0; overflow:hidden; color:#4d5b65; font-size:13px; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
    .detail { display:flex; min-width:0; flex-direction:column; }
    .detail-head { min-height:73px; padding:16px 20px; border-bottom:1px solid var(--line); }
    .detail-head h2 { font-size:16px; }
    .detail-head p { margin-top:5px; color:var(--muted); font-size:13px; }
    .message-list { flex:1; overflow:auto; padding:24px clamp(16px, 3vw, 48px); background:#f7f9f9; }
    .message { display:flex; margin-bottom:18px; }
    .message.assistant { justify-content:flex-start; }
    .message.customer { justify-content:flex-end; }
    .message-body { max-width:min(760px, 82%); }
    .message.customer .message-body { text-align:right; }
    .message-meta { margin-bottom:6px; color:var(--muted); font-size:12px; }
    .bubble { display:inline-block; padding:11px 13px; border:1px solid #d7e1e5; border-radius:7px; background:var(--visitor); text-align:left; white-space:pre-wrap; word-break:break-word; line-height:1.55; font-size:14px; }
    .assistant .bubble { border-color:#bde3d9; background:var(--assistant); }
    .empty { display:grid; min-height:260px; place-items:center; color:#7a878f; font-size:14px; }
    @media (max-width:760px) {
      .topbar { height:auto; flex-wrap:wrap; padding:14px 16px; }
      .stats { width:100%; order:3; margin-left:0; justify-content:space-between; }
      .layout { display:block; min-height:0; border:0; }
      .sidebar { border-right:0; border-bottom:1px solid var(--line); }
      .session-list { max-height:260px; }
      .detail { min-height:calc(100vh - 421px); }
      .message-list { min-height:400px; }
    }
  </style>
</head>
<body>
  <section class="login" aria-labelledby="login-title">
    <form id="login-form" class="login-panel">
      <div class="brand"><div class="brand-mark">华</div><div><h1 id="login-title">聊天记录后台</h1><p>华博士管理员登录</p></div></div>
      <label for="password">后台密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">登录</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">华</div><div><h1>聊天记录后台</h1><p>访客与华博士的历史对话</p></div></div>
      <div class="stats"><span>累计会话 <strong id="conversation-count">0</strong></span><span>消息总数 <strong id="message-count">0</strong></span></div>
      <button id="logout" class="logout" type="button">退出登录</button>
    </header>
    <section class="layout">
      <aside class="sidebar">
        <div class="search"><input id="search" type="search" placeholder="搜索消息、会话或 IP"></div>
        <div id="session-list" class="session-list"><div class="empty">暂无会话</div></div>
      </aside>
      <section class="detail">
        <header class="detail-head"><h2 id="detail-title">选择一个会话</h2><p id="detail-meta">聊天消息会在此显示</p></header>
        <div id="message-list" class="message-list"><div class="empty">从左侧选择一个会话</div></div>
      </section>
    </section>
  </main>

  <script>
    const state = { token: "", selected: "", timer: null, searchTimer: null };
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const formatTime = (value) => String(value || "").replace("T", " ");
    function headers() { return { Authorization: `Bearer ${state.token}` }; }
    async function api(path) {
      const response = await fetch(path, { headers: headers() });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || "请求失败");
      return body;
    }
    function conversationTitle(item) {
      const time = formatTime(item.started_at || item.updated_at).slice(5, 16);
      return time ? `访客咨询 · ${time}` : "访客咨询";
    }
    async function loadStats() {
      const data = await api("/api/admin/stats");
      $("conversation-count").textContent = data.conversations || 0;
      $("message-count").textContent = data.messages || 0;
    }
    async function loadSessions() {
      const query = encodeURIComponent($("search").value.trim());
      const data = await api(`/api/admin/conversations?limit=150&query=${query}`);
      const list = $("session-list");
      if (!data.items || !data.items.length) { list.innerHTML = '<div class="empty">暂无会话</div>'; return; }
      list.innerHTML = data.items.map((item) => `
        <button class="session ${item.session_id === state.selected ? "active" : ""}" type="button" data-session="${escapeHtml(item.session_id)}">
          <div class="session-head"><span class="session-title">${escapeHtml(conversationTitle(item))}</span><span class="session-time">${escapeHtml(formatTime(item.updated_at).slice(5, 16))}</span></div>
          <div class="session-preview">${escapeHtml(item.last_user_message || item.last_answer || "暂无消息")}</div>
          <div class="session-meta"><span>${escapeHtml(item.client_ip || "未知 IP")}</span><span>${Number(item.message_count || 0)} 条消息</span></div>
        </button>`).join("");
      list.querySelectorAll("[data-session]").forEach((button) => button.addEventListener("click", () => loadConversation(button.dataset.session)));
    }
    function senderLabel(item) { return item.sender_type === "customer" ? "访客" : "华博士"; }
    function messageHtml(item) {
      const payload = item.payload || {};
      const devices = Array.isArray(payload.recommended_devices)
        ? payload.recommended_devices.map((device) => device && device.name).filter(Boolean)
        : [];
      const productLine = devices.length
        ? `<div class="message-meta">候选产品：${escapeHtml(devices.join("、"))}</div>`
        : "";
      return `<article class="message ${item.sender_type === "customer" ? "customer" : "assistant"}">
        <div class="message-body"><div class="message-meta">${escapeHtml(senderLabel(item))} · ${escapeHtml(formatTime(item.created_at))}</div><div class="bubble">${escapeHtml(item.content)}</div>${productLine}</div>
      </article>`;
    }
    async function loadConversation(sessionId) {
      const data = await api(`/api/admin/conversations/${encodeURIComponent(sessionId)}`);
      state.selected = sessionId;
      const conversation = data.conversation || {};
      $("detail-title").textContent = conversationTitle(conversation);
      $("detail-meta").textContent = `${conversation.client_ip || "未知 IP"} · ${formatTime(conversation.started_at)} · ${conversation.message_count || 0} 条消息`;
      const list = $("message-list");
      list.innerHTML = data.messages?.length ? data.messages.map(messageHtml).join("") : '<div class="empty">暂无消息</div>';
      list.scrollTop = list.scrollHeight;
      await loadSessions();
    }
    async function refresh() { await Promise.all([loadStats(), loadSessions()]); if (state.selected) await loadConversation(state.selected); }
    function startPolling() { clearInterval(state.timer); state.timer = setInterval(() => refresh().catch(() => {}), 10000); }
    $("login-form").addEventListener("submit", async (event) => {
      event.preventDefault(); state.token = $("password").value.trim(); $("login-error").textContent = "";
      try { await refresh(); document.body.classList.add("ready"); startPolling(); }
      catch (error) { state.token = ""; $("login-error").textContent = error.message || "登录失败"; }
    });
    $("search").addEventListener("input", () => { clearTimeout(state.searchTimer); state.searchTimer = setTimeout(() => loadSessions().catch(() => {}), 250); });
    $("logout").addEventListener("click", () => { clearInterval(state.timer); state.token = ""; state.selected = ""; $("password").value = ""; document.body.classList.remove("ready"); $("password").focus(); });
  </script>
</body>
</html>
